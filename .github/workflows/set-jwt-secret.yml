# Manually-triggered utility to set/rotate the JWT_SECRET Fly secret.
# Run from the Actions tab ("Run workflow") or via the API. The value is
# generated on the runner with `openssl rand -hex 32` and is never printed:
# GitHub Actions echoes the command source (the literal `$(...)`), not its
# expansion, and flyctl does not print secret values. Setting the secret
# triggers a Fly release/restart so the app picks it up.
name: Set JWT Secret
on:
  workflow_dispatch:

jobs:
  set-secret:
    name: Set JWT_SECRET on perumda-ledger-scs9va
    runs-on: ubuntu-latest
    concurrency: fly-deploy-group
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set JWT_SECRET
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets set JWT_SECRET="$(openssl rand -hex 32)" --app perumda-ledger-scs9va
